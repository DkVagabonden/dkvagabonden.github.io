<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of ServiceNow development tools">
  <title>Pizza Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="tools-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-mark">🔧</span>
        <div>
          <h1>Pizza Tools</h1>
          <p>ServiceNow development utilities</p>
        </div>
      </div>
    </div>
  </header>

  <main class="tools-main">
    <section class="tools-grid">
      
      <!-- Plugin Update Site Tool -->
      <a href="pluginUpdateSite/index.html" class="tool-card tool-card-link">
        <div class="tool-image-container">
          <img src="pizza.svg" alt="PluginUpdateSite" class="tool-image">
        </div>
        <div class="tool-content">
          <h2>PluginUpdateSite</h2>
          <p>Review installed ServiceNow plugins before an instance upgrade.</p>
          <span class="tool-link">Launch Tool →</span>
        </div>
      </a>

      <!-- Tool 2 - Placeholder -->
      <div class="tool-card">
        <div class="tool-image-container">
          <img src="pizza.svg" alt="Tool 2" class="tool-image">
        </div>
        <div class="tool-content">
          <h2>Next Tool</h2>
          <p>Coming soon...</p>
          <span class="tool-badge">Soon</span>
        </div>
      </div>

      <!-- Tool 3 - Placeholder -->
      <div class="tool-card">
        <div class="tool-image-container">
          <img src="pizza.svg" alt="Tool 3" class="tool-image">
        </div>
        <div class="tool-content">
          <h2>Another Tool</h2>
          <p>Coming soon...</p>
          <span class="tool-badge">Soon</span>
        </div>
      </div>

      <!-- Tool 4 - Placeholder -->
      <div class="tool-card">
        <div class="tool-image-container">
          <img src="pizza.svg" alt="Tool 4" class="tool-image">
        </div>
        <div class="tool-content">
          <h2>Upcoming Tool</h2>
          <p>Coming soon...</p>
          <span class="tool-badge">Soon</span>
        </div>
      </div>

    </section>
  </main>

  <footer class="tools-footer">
    <p>Made with ❤️ for ServiceNow development</p>
  </footer>
</body>
</html>
