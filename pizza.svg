<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f6f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eeed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pizzaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c89060;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Pizza slice -->
  <g transform="translate(200, 150)">
    <!-- Crust -->
    <circle cx="0" cy="0" r="120" fill="url(#pizzaGradient)" stroke="#b8805a" stroke-width="2"/>
    
    <!-- Cheese -->
    <circle cx="0" cy="0" r="115" fill="#f4d03f" opacity="0.9"/>
    
    <!-- Pepperoni circles -->
    <circle cx="30" cy="-40" r="12" fill="#c92a2a" opacity="0.85"/>
    <circle cx="-35" cy="-35" r="10" fill="#c92a2a" opacity="0.85"/>
    <circle cx="0" cy="-10" r="11" fill="#c92a2a" opacity="0.85"/>
    <circle cx="45" cy="20" r="9" fill="#c92a2a" opacity="0.85"/>
    <circle cx="-45" cy="15" r="10" fill="#c92a2a" opacity="0.85"/>
    <circle cx="15" cy="45" r="8" fill="#c92a2a" opacity="0.85"/>
    <circle cx="-20" cy="50" r="9" fill="#c92a2a" opacity="0.85"/>
    
    <!-- Basil leaves (optional) -->
    <g opacity="0.7">
      <ellipse cx="25" cy="30" rx="6" ry="10" fill="#087f5b" transform="rotate(-30 25 30)"/>
      <ellipse cx="-30" cy="-20" rx="5" ry="9" fill="#087f5b" transform="rotate(45 -30 -20)"/>
    </g>
  </g>
</svg>
